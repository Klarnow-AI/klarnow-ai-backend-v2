# Build frontend Docker image only when frontend (or Docker config) changes.
# Uses Docker layer cache to speed up repeated builds.
name: Frontend build

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - "frontend/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - "frontend/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/frontend-build.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  build:
    needs: checks
    runs-on: ubuntu-latest
    env:
      STAGING_NEXT_PUBLIC_API_URL: https://api.staging.klarnow.ai
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          # Configure STAGING_NEXT_PUBLIC_GOOGLE_CLIENT_ID as a GitHub Actions variable.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.STAGING_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.STAGING_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          push: false
          load: true
          tags: klarnow-frontend:build
          cache-from: type=gha
          cache-to: type=gha,mode=max
