name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
      - "alembic/**"
      - "scripts/**"
      - "tests/**"
      - "supabase/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "alembic.ini"
      - "Dockerfile"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "app/**"
      - "alembic/**"
      - "scripts/**"
      - "tests/**"
      - "supabase/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "alembic.ini"
      - "Dockerfile"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile app
        run: python -m compileall app
      - name: Run tests
        run: |
          if ls tests/*.py >/dev/null 2>&1; then
            python -m pytest -q
          else
            echo "No tests found; skipping pytest"
          fi
