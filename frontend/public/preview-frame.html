<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CDN scripts are loaded once when the iframe mounts.
    Subsequent code updates are received via postMessage and re-executed
    without reloading these scripts, eliminating flicker between edits.
  -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    var _root = null;
    var _rootEl = document.getElementById('root');

    // Post an error back to the parent window so ChatPanel can auto-fix it
    function reportError(msg) {
      try { window.parent.postMessage({ type: 'PREVIEW_ERROR', error: msg }, '*'); } catch (_) {}
    }

    // Strip any remaining ES module syntax from the bundle so Babel doesn't
    // switch to module mode (which disallows top-level `return`).
    function stripModuleSyntax(code) {
      // Remove import statements of all common forms
      code = code.replace(/^\s*import\s+type\s+[\s\S]*?from\s+['"][^'"]*['"]\s*;?\s*$/gm, '');
      code = code.replace(/^\s*import\s+[\s\S]*?from\s+['"][^'"]*['"]\s*;?\s*$/gm, '');
      code = code.replace(/^\s*import\s+['"][^'"]*['"]\s*;?\s*$/gm, '');
      // Remove "use client" / "use server" directives (Next.js)
      code = code.replace(/^\s*['"]use (client|server)['"]\s*;?\s*$/gm, '');
      // Remove export * re-exports (export * from '...', export * as X from '...')
      code = code.replace(/^\s*export\s+\*\s*(?:as\s+\w+\s+)?from\s+['"][^'"]*['"]\s*;?\s*$/gm, '');
      // Remove TypeScript-specific export declarations
      code = code.replace(/^\s*export\s+type\s+\{[^}]*\}\s*(?:from\s+['"][^'"]*['"]\s*)?;?\s*$/gm, '');
      code = code.replace(/^\s*export\s+interface\s+/gm, 'interface ');
      code = code.replace(/^\s*export\s+type\s+(\w)/gm, 'type $1');
      code = code.replace(/^\s*export\s+enum\s+/gm, 'enum ');
      // Rewrite export keywords (keep the declaration itself)
      code = code.replace(/^\s*export\s+default\s+function\s+/gm, 'function ');
      code = code.replace(/^\s*export\s+default\s+class\s+/gm, 'class ');
      code = code.replace(/^\s*export\s+default\s+/gm, 'var _default = ');
      code = code.replace(/^\s*export\s+function\s+/gm, 'function ');
      code = code.replace(/^\s*export\s+class\s+/gm, 'class ');
      code = code.replace(/^\s*export\s+const\s+/gm, 'const ');
      code = code.replace(/^\s*export\s+let\s+/gm, 'let ');
      code = code.replace(/^\s*export\s+var\s+/gm, 'var ');
      code = code.replace(/^\s*export\s+\{[^}]*\}\s*(?:from\s+['"][^'"]*['"]\s*)?;?\s*$/gm, '');
      return code;
    }

    // Error boundary source (JSX — Babel-transformed along with the user bundle)
    var _EB_SRC = [
      'class _EB extends React.Component {',
      '  constructor(p) { super(p); this.state = { error: null }; }',
      '  static getDerivedStateFromError(e) { return { error: e.message }; }',
      '  componentDidCatch(error) {',
      '    try { window.parent.postMessage({ type: "PREVIEW_ERROR", error: error.message }, "*"); } catch(_) {}',
      '  }',
      '  render() {',
      '    if (this.state.error) return (',
      '      <div style={{padding:"24px",fontFamily:"ui-monospace,monospace",fontSize:"13px",',
      '                   lineHeight:"1.6",background:"#fef2f2",minHeight:"100vh"}}>',
      '        <strong style={{fontSize:"14px",color:"#dc2626"}}>Preview Error</strong>',
      '        <pre style={{marginTop:"8px",whiteSpace:"pre-wrap",color:"#374151"}}>',
      '          {this.state.error}',
      '        </pre>',
      '        <p style={{marginTop:"12px",fontSize:"12px",color:"#9ca3af"}}>',
      '          Sending this error to Klaro for automatic fixing…',
      '        </p>',
      '      </div>',
      '    );',
      '    return this.props.children;',
      '  }',
      '}',
    ].join('\n');

    function renderBundle(userBundle) {
      // Strip any leftover module syntax before handing to Babel.
      // This prevents Babel from switching to "module" sourceType, which
      // would reject the top-level `return` in the new Function body.
      var cleanBundle = stripModuleSyntax(userBundle);

      // Combine error boundary + clean user bundle + result variable.
      // The result is assigned to __RESULT__ (not returned) so that Babel
      // never sees a top-level `return` — we append it after transformation.
      var fullCode = _EB_SRC + '\n\n'
        + cleanBundle + '\n\n'
        + 'var _App = typeof App !== "undefined" ? App'
        + '  : function() { return <div>No App component found</div>; };\n'
        + 'var __RESULT__ = { App: _App, EB: _EB };';

      try {
        // sourceType: 'script' tells Babel that this is not an ES module.
        // Combined with moving `return` out of the Babel input (appended
        // after transformation), this avoids "return outside of function".
        var transformed = Babel.transform(fullCode, {
          presets: ['react'],
          sourceType: 'script',
        }).code;

        // Append `return` AFTER Babel transform — inside the new Function
        // body it is valid (the body is inherently a function scope).
        var factory = new Function('React', 'ReactDOM', transformed + '\nreturn __RESULT__;');
        var result = factory(React, ReactDOM);

        if (_root) { _root.unmount(); _root = null; }
        _root = ReactDOM.createRoot(_rootEl);
        _root.render(
          React.createElement(result.EB, null, React.createElement(result.App))
        );
      } catch (err) {
        // Babel parse errors and synchronous throws — render inline since the
        // error boundary only catches runtime React errors.
        var msg = err.message || 'Unknown error';
        reportError(msg);

        var safeMsg = msg
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        _rootEl.innerHTML =
          '<div style="padding:24px;font-family:ui-monospace,monospace;font-size:13px;'
          + 'line-height:1.6;background:#fef2f2;min-height:100vh">'
          + '<strong style="font-size:14px;color:#dc2626">Preview Error</strong>'
          + '<pre style="margin-top:8px;white-space:pre-wrap;color:#374151">' + safeMsg + '</pre>'
          + '<p style="margin-top:12px;font-size:12px;color:#9ca3af">'
          + 'Sending this error to Klaro for automatic fixing\u2026</p>'
          + '</div>';
      }
    }

    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'UPDATE') return;
      renderBundle(e.data.code);
    });
  </script>
</body>
</html>
